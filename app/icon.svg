<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    favicon：导航栏那枚标记（components/soj/sundial-mark.tsx）的**小尺寸光学版**。
    同一份几何，两处落点；差别只在两处：

    1. **有底**。标签栏可能是浅色的（本机就是），冷银笔画放在白底上等于消失，
       所以铺一层曜石底。深色标签栏上它也读得出——底色与银笔画是强对照。
    2. **笔宽比导航栏那版更重**。标签栏拿到的像素比导航栏还少：16 CSS px，
       Retina 下 32 设备像素。原图笔宽只占直径 5.7%，在这个尺度下会糊成灰雾。
       环取 1.9×、S 取 1.45×（不是同一系数：环的曲率半径 632、S 的字腔只有百来单位，
       同笔宽先糊死的一定是 S）。这是逐格比对 16/32/48px 真像素后取的档。

    三条 path 的顺序仍有意义：环最后画，盖住 S 起点的圆头（linecap 是整条 path 统一的，
    环两端平切、S 两端圆头，只能拆开）。
  -->
