name: Deploy Web

# 打 web-v* tag 时构建 standalone 产物并发布到 GitHub Release。
# 服务器端（<deploy-host>）由 soj-web-deploy.timer 每 5 分钟轮询新 tag，
# 下载本 Job 产出的 soj-web-<ver>.tar.gz 完成部署——服务器上不做任何构建（2G 内存）。

on:
  push:
    tags:
      - "web-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build (standalone)
        run: npm run build
        env:
          # 生产走真实后端适配器；该变量是构建期内联，必须在 build 时给出
          NEXT_PUBLIC_SOJ_API_MODE: http

      - name: Assemble bundle
        run: |
          VER="${GITHUB_REF_NAME#web-}"
          cp -r public .next/standalone/public
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          tar -czf "/tmp/soj-web-${VER}.tar.gz" -C .next/standalone .

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/soj-web-*.tar.gz
